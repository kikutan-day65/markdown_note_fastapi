services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./env/.env.dev
      - ./env/.env.db.common
    depends_on:
      - db
    volumes:
      - .:/app
  test:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./env/.env.test
      - ./env/.env.db.common
    depends_on:
      - db
    volumes:
      - .:/app
    entrypoint: ["bash", "/app/docker/test/pytest.sh"]
  db:
    image: postgres:18
    ports:
      - "5433:5432"
    env_file:
      - ./env/.env.db.init
      - ./env/.env.db.common
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres-data:
