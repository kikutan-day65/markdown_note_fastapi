[project]
name = "markdown-note-fastapi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.1",
    "pytest-mock>=3.15.1",
]
